<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hole of Fame - Rechnung</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF-Lib zum Bearbeiten des PDFs -->
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8 font-sans">

    <div class="max-w-lg mx-auto bg-white p-6 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-6 text-gray-800 border-b pb-2">Rechnung erstellen</h1>
        
        <div class="space-y-4">
            <!-- EMPFÄNGER -->
            <div>
                <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-3">Empfänger</h2>
                
                <label class="block text-sm font-medium text-gray-700">Verein / Firma</label>
                <input type="text" id="inEmpfaenger" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 mb-3" value="Kulturverein e.V.">
                
                <label class="block text-sm font-medium text-gray-700">Name, Vorname</label>
                <input type="text" id="inName" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 mb-3" value="Max Mustermann">
                
                <label class="block text-sm font-medium text-gray-700">Straße Nr.</label>
                <input type="text" id="inStrasse" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 mb-3" value="Musterstraße 12">
                
                <label class="block text-sm font-medium text-gray-700">PLZ Ort</label>
                <input type="text" id="inOrt" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 mb-5" value="12345 Musterstadt">
            </div>

            <!-- RECHNUNGSDATEN -->
            <div>
                <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-3">Daten</h2>
                
                <label class="block text-sm font-medium text-gray-700">Rechnungsnummer</label>
                <input type="text" id="inNr" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 mb-3" value="2026-05-01">
                
                <div class="grid grid-cols-2 gap-4 mb-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Datum</label>
                        <input type="text" id="inDatum" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" value="29.05.2026" oninput="updateFaellig()">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Fällig am (auto)</label>
                        <input type="text" id="inFaellig" class="mt-1 block w-full rounded-md border-gray-200 bg-gray-50 text-gray-500 shadow-sm border p-2" readonly>
                    </div>
                </div>
            </div>

            <!-- POSTEN -->
            <div>
                <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-3">Posten (max. 3)</h2>
                
                <!-- Posten 1 -->
                <div class="grid grid-cols-3 gap-2 mb-3">
                    <div class="col-span-2">
                        <label class="block text-xs font-medium text-gray-700">Beschreibung 1</label>
                        <input type="text" id="inPos1" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" value="Honorarnote Konzertbetreuung">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Betrag (€)</label>
                        <input type="number" id="inBetrag1" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" value="150.00" step="0.01">
                    </div>
                </div>

                <!-- Posten 2 -->
                <div class="grid grid-cols-3 gap-2 mb-3">
                    <div class="col-span-2">
                        <label class="block text-xs font-medium text-gray-700">Beschreibung 2</label>
                        <input type="text" id="inPos2" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="Optional...">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Betrag (€)</label>
                        <input type="number" id="inBetrag2" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="0.00" step="0.01">
                    </div>
                </div>

                <!-- Posten 3 -->
                <div class="grid grid-cols-3 gap-2 mb-5">
                    <div class="col-span-2">
                        <label class="block text-xs font-medium text-gray-700">Beschreibung 3</label>
                        <input type="text" id="inPos3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="Optional...">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Betrag (€)</label>
                        <input type="number" id="inBetrag3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="0.00" step="0.01">
                    </div>
                </div>
            </div>

            <!-- BUTTON -->
            <button onclick="generatePDF()" id="btnGenerate" class="w-full bg-black text-white font-bold py-3 px-4 rounded-md hover:bg-gray-800 transition-colors">
                PDF herunterladen
            </button>
            <p id="statusMsg" class="text-center text-sm text-gray-500 mt-2 hidden">PDF wird generiert...</p>
        </div>
    </div>

    <script>
        // Fälligkeitsdatum berechnen (+14 Tage)
        function updateFaellig() {
            const datumStr = document.getElementById('inDatum').value;
            const parts = datumStr.split('.');
            if (parts.length === 3) {
                const date = new Date(parts[2], parts[1] - 1, parts[0]);
                date.setDate(date.getDate() + 14);
                const dd = String(date.getDate()).padStart(2, '0');
                const mm = String(date.getMonth() + 1).padStart(2, '0');
                const yyyy = date.getFullYear();
                document.getElementById('inFaellig').value = `${dd}.${mm}.${yyyy}`;
            }
        }
        // Initial einmal beim Starten aufrufen
        updateFaellig();

        // Währungs-Formatierung
        function formatCurrency(val) {
            return val.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
        }

        async function generatePDF() {
            const btn = document.getElementById('btnGenerate');
            const status = document.getElementById('statusMsg');
            btn.disabled = true;
            btn.classList.add('opacity-50');
            status.classList.remove('hidden');
            status.innerText = "PDF wird generiert...";

            try {
                // 1. Lade das leere PDF vom Server
                const url = 'template.pdf';
                const existingPdfBytes = await fetch(url).then(res => res.arrayBuffer());

                // 2. Öffne das PDF mit pdf-lib
                const pdfDoc = await PDFLib.PDFDocument.load(existingPdfBytes);
                const page = pdfDoc.getPages()[0];

                // 3. Schriftarten einbinden
                const fontReg = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
                const fontBold = await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);

                // 4. Werte auslesen
                const empfaenger = document.getElementById('inEmpfaenger').value;
                const name = document.getElementById('inName').value;
                const strasse = document.getElementById('inStrasse').value;
                const ort = document.getElementById('inOrt').value;
                
                const nr = document.getElementById('inNr').value;
                const datum = document.getElementById('inDatum').value;
                const faellig = document.getElementById('inFaellig').value;
                
                // Posten auslesen
                const pos1 = document.getElementById('inPos1').value;
                const pos2 = document.getElementById('inPos2').value;
                const pos3 = document.getElementById('inPos3').value;
                
                const betrag1 = parseFloat(document.getElementById('inBetrag1').value) || 0;
                const betrag2 = parseFloat(document.getElementById('inBetrag2').value) || 0;
                const betrag3 = parseFloat(document.getElementById('inBetrag3').value) || 0;
                const gesamtBetrag = betrag1 + betrag2 + betrag3;

                // Hilfsfunktion zum Zeichnen von Text
                const draw = (text, x, y, size = 11, font = fontReg) => {
                    if(!text) return; 
                    page.drawText(text, {
                        x: x,
                        y: y,
                        size: size,
                        font: font,
                        color: PDFLib.rgb(0, 0, 0),
                    });
                };

                // ---------------------------------------------------------
                // --- KOORDINATEN ANPASSEN (WICHTIG!) ---
                // X = Links/Rechts | Y = Oben/Unten (0 ist ganz UNTEN auf der Seite)
                // ---------------------------------------------------------
                
                // Empfänger-Block
                draw(empfaenger, 60, 620, 11, fontBold);
                draw(name, 60, 605);
                draw(strasse, 60, 590);
                draw(ort, 60, 575);

                // Rechnungsdaten 
                draw(nr, 160, 480);
                draw(datum, 400, 480);
                draw(faellig, 400, 465);

                // Posten (Y-Werte gehen schrittweise nach unten)
                if (pos1 || betrag1 > 0) {
                    draw(pos1, 60, 400);
                    draw(formatCurrency(betrag1), 400, 400);
                }
                if (pos2 || betrag2 > 0) {
                    draw(pos2, 60, 380);
                    draw(formatCurrency(betrag2), 400, 380);
                }
                if (pos3 || betrag3 > 0) {
                    draw(pos3, 60, 360);
                    draw(formatCurrency(betrag3), 400, 360);
                }
                
                // Gesamt-Summe
                draw(formatCurrency(gesamtBetrag), 400, 330, 11, fontBold);

                // ---------------------------------------------------------

                // 5. PDF speichern und Herunterladen
                const pdfBytes = await pdfDoc.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `Rechnung_${nr}.pdf`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                status.innerText = "PDF erfolgreich heruntergeladen!";
                status.classList.replace('text-gray-500', 'text-green-600');

            } catch (error) {
                console.error(error);
                status.innerText = "Fehler beim Erstellen des PDFs.";
                status.classList.replace('text-gray-500', 'text-red-600');
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        }
    </script>
</body>
</html>
