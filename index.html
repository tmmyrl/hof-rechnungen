<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hole of Fame | Rechnungen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        /* Verstecke Pfeile bei Nummernfeldern */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="text-gray-800 antialiased p-4 md:p-8">

    <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-gray-900 text-white p-6 text-center">
            <h1 class="text-2xl font-bold tracking-tight">Hole of Fame e.V.</h1>
            <p class="text-sm text-gray-400 mt-1">Rechnungs-Generator</p>
        </div>

        <div class="p-6 md:p-8 space-y-6">
            
            <section>
                <h2 class="text-lg font-semibold border-b pb-2 mb-4 text-gray-700">1. Empfänger</h2>
                <div class="space-y-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Name / Verein</label>
                        <input type="text" id="empfaengerName" placeholder="z.B. Kulturverein e.V." class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-gray-900 focus:outline-none bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Straße & Hausnummer</label>
                        <input type="text" id="empfaengerStrasse" placeholder="z.B. Musterstraße 12" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-gray-900 focus:outline-none bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">PLZ & Ort</label>
                        <input type="text" id="empfaengerOrt" placeholder="z.B. 01099 Dresden" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-gray-900 focus:outline-none bg-gray-50">
                    </div>
                </div>
            </section>

            <section>
                <h2 class="text-lg font-semibold border-b pb-2 mb-4 text-gray-700">2. Rechnungsdaten</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Rechnungs-Nr.</label>
                        <input type="text" id="rechnungsNr" placeholder="2026-05-01" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-gray-900 focus:outline-none bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Datum</label>
                        <input type="text" id="rechnungsDatum" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-gray-900 focus:outline-none bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Fällig am (+14 Tage)</label>
                        <input type="text" id="faelligkeitsDatum" readonly tabindex="-1" class="w-full px-4 py-2 border border-gray-200 rounded-lg bg-gray-100 text-gray-500 cursor-not-allowed focus:outline-none">
                    </div>
                </div>
            </section>

            <section>
                <h2 class="text-lg font-semibold border-b pb-2 mb-4 text-gray-700">3. Posten</h2>
                
                <!-- Posten 1 -->
                <div class="flex gap-2 mb-3">
                    <div class="flex-grow">
                        <input type="text" id="posten1Desc" placeholder="Leistungsbeschreibung 1" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-gray-900 focus:outline-none bg-gray-50">
                    </div>
                    <div class="w-28 relative">
                        <input type="number" id="posten1Price" placeholder="0.00" step="0.01" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-gray-900 focus:outline-none bg-gray-50 text-right pr-8">
                        <span class="absolute right-3 top-2.5 text-gray-500">€</span>
                    </div>
                </div>

                <!-- Posten 2 -->
                <div class="flex gap-2 mb-3">
                    <div class="flex-grow">
                        <input type="text" id="posten2Desc" placeholder="Leistungsbeschreibung 2 (optional)" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-gray-900 focus:outline-none bg-gray-50">
                    </div>
                    <div class="w-28 relative">
                        <input type="number" id="posten2Price" placeholder="0.00" step="0.01" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-gray-900 focus:outline-none bg-gray-50 text-right pr-8">
                        <span class="absolute right-3 top-2.5 text-gray-500">€</span>
                    </div>
                </div>

                <!-- Posten 3 -->
                <div class="flex gap-2">
                    <div class="flex-grow">
                        <input type="text" id="posten3Desc" placeholder="Leistungsbeschreibung 3 (optional)" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-gray-900 focus:outline-none bg-gray-50">
                    </div>
                    <div class="w-28 relative">
                        <input type="number" id="posten3Price" placeholder="0.00" step="0.01" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-gray-900 focus:outline-none bg-gray-50 text-right pr-8">
                        <span class="absolute right-3 top-2.5 text-gray-500">€</span>
                    </div>
                </div>
            </section>

            <div class="pt-4">
                <button id="generateBtn" onclick="generatePDF()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-4 rounded-xl shadow-lg transition-all active:scale-95 flex justify-center items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>
                    PDF generieren & Senden
                </button>
                
                <!-- Nachrichten-Box (Erfolg/Fehler) -->
                <div id="statusMessage" class="mt-4 p-4 rounded-lg hidden text-sm font-medium text-center border"></div>
            </div>

        </div>
    </div>

    <script>
        // Vorbelegung des Datums mit dem heutigen Tag
        const today = new Date();
        const dd = String(today.getDate()).padStart(2, '0');
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const yyyy = today.getFullYear();
        document.getElementById('rechnungsDatum').value = `${dd}.${mm}.${yyyy}`;

        // Funktion zur automatischen Berechnung des Fälligkeitsdatums (+14 Tage)
        function updateFaelligkeit() {
            const rDatumStr = document.getElementById('rechnungsDatum').value;
            const parts = rDatumStr.split('.');
            if(parts.length === 3) {
                const d = new Date(parts[2], parts[1]-1, parts[0]);
                if(!isNaN(d.getTime())) {
                    d.setDate(d.getDate() + 14);
                    const f_dd = String(d.getDate()).padStart(2, '0');
                    const f_mm = String(d.getMonth() + 1).padStart(2, '0');
                    const f_yyyy = d.getFullYear();
                    document.getElementById('faelligkeitsDatum').value = `${f_dd}.${f_mm}.${f_yyyy}`;
                    return;
                }
            }
            document.getElementById('faelligkeitsDatum').value = "Ungültig";
        }

        document.getElementById('rechnungsDatum').addEventListener('input', updateFaelligkeit);
        updateFaelligkeit();

        // Hilfsfunktion um Zahlen als Euro zu formatieren
        function formatCurrency(num) {
            if (isNaN(num) || num === 0) return "";
            return num.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
        }

        // Funktion zum Anzeigen von Statusmeldungen
        function showMessage(msg, type = 'success') {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.innerHTML = msg; // HTML erlauben (für Links)
            statusDiv.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'border-red-200', 'bg-green-50', 'text-green-700', 'border-green-200', 'bg-blue-50', 'text-blue-700', 'border-blue-200');
            
            if (type === 'error') {
                statusDiv.classList.add('bg-red-50', 'text-red-700', 'border-red-200');
            } else if (type === 'info') {
                statusDiv.classList.add('bg-blue-50', 'text-blue-700', 'border-blue-200');
            } else {
                statusDiv.classList.add('bg-green-50', 'text-green-700', 'border-green-200');
            }
        }

        // Hilfsfunktion für den klassischen Download (Desktop Fallback)
        function downloadFile(blob, filename) {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Hauptfunktion zur PDF-Generierung
        async function generatePDF() {
            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            btn.innerHTML = '<svg class="animate-spin h-5 w-5 mr-3 text-white" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Erstelle PDF...';
            document.getElementById('statusMessage').classList.add('hidden');

            try {
                // 1. Lade das Canva PDF Template vom Server
                const url = 'template.pdf';
                const templateBytes = await fetch(url).then(res => {
                    if (!res.ok) throw new Error("Template PDF nicht gefunden. Bitte lade 'template.pdf' auf GitHub hoch.");
                    return res.arrayBuffer();
                });

                // 2. Initialisiere pdf-lib
                const { PDFDocument, rgb, StandardFonts } = PDFLib;
                const pdfDoc = await PDFDocument.load(templateBytes);
                const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
                const boldFont = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
                const pages = pdfDoc.getPages();
                const firstPage = pages[0];
                const { height } = firstPage.getSize(); 

                const drawText = (text, x, yFromTop, size = 11, fontType = font) => {
                    if (!text) return;
                    firstPage.drawText(text, { x: x, y: height - yFromTop, size: size, font: fontType, color: rgb(0.1, 0.1, 0.1) });
                };

                // --- DATEN AUSLESEN ---
                const empfName = document.getElementById('empfaengerName').value;
                const empfStrasse = document.getElementById('empfaengerStrasse').value;
                const empfOrt = document.getElementById('empfaengerOrt').value;
                const rNr = document.getElementById('rechnungsNr').value;
                const rDatum = document.getElementById('rechnungsDatum').value;
                const fDatum = document.getElementById('faelligkeitsDatum').value;
                
                // --- KOORDINATEN ANPASSEN (WICHTIG!) ---
                drawText(empfName, 60, 210, 11, boldFont);
                drawText(empfStrasse, 60, 225, 11);
                drawText(empfOrt, 60, 240, 11);

                drawText(rNr, 180, 320, 11);
                drawText(rDatum, 180, 340, 11);
                drawText(fDatum, 180, 360, 11);

                let yOffset = 420; 
                let totalSum = 0;

                for (let i = 1; i <= 3; i++) {
                    const desc = document.getElementById(`posten${i}Desc`).value;
                    const priceVal = parseFloat(document.getElementById(`posten${i}Price`).value.replace(',', '.'));
                    
                    if (desc || !isNaN(priceVal)) {
                        drawText(desc, 60, yOffset, 11);
                        if (!isNaN(priceVal)) {
                            totalSum += priceVal;
                            drawText(formatCurrency(priceVal), 450, yOffset, 11);
                        }
                        yOffset += 20; 
                    }
                }

                yOffset += 10; 
                drawText("GESAMT", 60, yOffset, 12, boldFont);
                drawText(formatCurrency(totalSum), 450, yOffset, 12, boldFont);

                // 3. Generiertes PDF speichern
                const pdfBytes = await pdfDoc.save();
                const fileName = `Rechnung_${empfName.replace(/[^a-z0-9]/gi, '_') || 'Hof'}_${rNr}.pdf`;
                const blob = new Blob([pdfBytes], { type: "application/pdf" });

                // 4. TEILEN / SENDEN LOGIK (Mobile vs Desktop)
                const fileToShare = new File([blob], fileName, { type: "application/pdf" });

                // Prüfen ob das Handy/Gerät das Teilen von Dateien unterstützt
                if (navigator.canShare && navigator.canShare({ files: [fileToShare] })) {
                    try {
                        await navigator.share({
                            files: [fileToShare],
                            title: 'Neue Rechnung Hole of Fame',
                            text: 'Hallo Tommy, anbei eine neue Rechnung zur Unterschrift.'
                        });
                        showMessage("PDF wurde geteilt!", "success");
                    } catch (err) {
                        // Abbruch durch Nutzer oder Fehler -> Fallback Download
                        console.log("Teilen abgebrochen, lade Datei herunter.", err);
                        downloadFile(blob, fileName);
                        showMessage(`PDF heruntergeladen.<br>Bitte sende es per Mail an: <a href="mailto:tommy@holeoffame.de" class="font-bold underline text-blue-800">tommy@holeoffame.de</a>`, "info");
                    }
                } else {
                    // Fallback für Desktop-Browser ohne Share-Funktion
                    downloadFile(blob, fileName);
                    showMessage(`PDF heruntergeladen.<br>Bitte sende es per Mail an: <a href="mailto:tommy@holeoffame.de" class="font-bold underline text-blue-800">tommy@holeoffame.de</a>`, "info");
                }

            } catch (error) {
                console.error(error);
                showMessage(error.message || "Fehler beim Erstellen. Ist template.pdf vorhanden?", "error");
            } finally {
                // Button zurücksetzen
                btn.disabled = false;
                btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg> PDF generieren & Senden';
            }
        }
    </script>
</body>
</html>
